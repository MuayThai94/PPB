; ═══════════════════════════════════════════════════════════════════════════════
;  PPB.ini — Precision Physic Bodies general settings (born 2026-08-30)
;  HOT FILE: edits apply within ~1 second, no restart. ';' or '#' start a comment.
;  A missing key falls back to the coded default, so lines here can stay sparse - and so does a
;  value that is not 1/0, true/false or on/off (e.g. "no" reads as the default, not as off).
; ═══════════════════════════════════════════════════════════════════════════════

[Equip]
; A gesture equip onto an OCCUPIED biped slot refuses (piece falls, blocker named)
; instead of the vanilla silent swap. Framework devices (zad/zbf/DOM) never block
; each other — DD arbitrates its own layering.
bSlotOccupiedRefuse=1

; A device is REFUSED when a non-device garment already covers ITS OWN region (per-region, not
; "wearing a body slot": a cuirass must not block a wrist cuff). Used only when the DD/ZaZ AddOn's
; own gate is absent - with the AddOn installed its gate decides, and this switch does not turn it
; off. A worn framework device (zad/zbf/DOM) never blocks. Region -> blocking slots:
;   head/eyes 30/31/42 . mouth 44 . neck 45 . chest/torso 32 . wrist 34/59 (a glove does NOT block a cuff)
;   hands/fingers 33 . ankle/feet 37/38 . waist/vaginal/anal 32/49/52 (a plug under a dress is refused)
;   + a locked chastity belt blocks the vaginal/anal sites unless it permits that opening.
bClothingGate=1

[Features]
; ── FOMOD-level feature switches (born 2026-09-11) ────────────────────────────
; These are SHIP switches, not dials: the FOMOD installs one variant of this file.
; Each is ANDed with its existing tuning master, so the knobs still work as dials
; (push/shove also needs `pushStep 1` in PPB_tuning.txt; gestures also need
; `enabled 1`). A missing key = ON, so an upgrade changes nothing for anyone.
; Hot: a saved edit applies within ~1 s for push; the gesture layer arms at load,
; so changing bEquipGestures needs a game restart, not a rebuild.
; The startup receipt "PPB FEATURES:" in PPB.log states the effective answer.

; Push / shove / stagger / knockdown / feet-lift — the whole mechanism. 0 = none of the four below, whatever they say.
bPushShove=1

; ── The four push outcomes (2.2.0). Each only matters while bPushShove=1. Hot, ~1 s. ──
; Push WALK: press an NPC firmly and hold, and she steps back away from your hand until the pressure stops.
bPushWalk=0

; Push STUMBLE: a firm, quick push makes her stagger (the vanilla stagger, turned to face the push).
bPushStumble=0

; Shove KNOCKDOWN: a hard shove knocks her to the ground (ragdoll). With this off and the stumble on, a hard
; shove plays a stumble instead.
bShoveRagdoll=1

; Press-to-equip / two-hand undress / fingertip plug extraction, and the support
; modules that make a gesture-equipped item persist (HoldPool, OutfitGuard).
bEquipGestures=0

; Leg SWEEP knockdown: sweeping or lifting her feet off the floor with your hand or a weapon knocks her down -
; both feet must leave the floor (one leg up does not trip her). Leaning NPCs can still be swept. A sub-feature of
; push/shove - moot when bPushShove=0. Hot, ~1 s. The walk, stumble and shove knockdown are NOT affected.
bFeetLift=0

; ★ 2026-09-30: TWO MORE install choices live in the SECOND file PPB_Options.ini (same folder, read after this one - a key it carries
; wins): bHavokBreast (PPB's Havok breast; a missing key = OFF) and bOutfitGuard (OutfitGuard under the equip gestures; missing = ON).

; SetDontMove GUARD (2026-09-23). Captive / prisoner mods (SeverActions, Diary of Mine, ZaZ, Yield To Me) pin an NPC
; with SetDontMove. In VR that pin breaks at the first knockdown: she keeps playing a walk against a body that cannot
; translate - the MOONWALK. On: PPB refuses SetDontMove on the NPCs it drives (humanoids on a PPB skeleton; never the
; player, a creature or a mount) and announces it, so VR Chains & Devices can hold her with STAND instead. Without
; that mod she is simply free to walk - never moonwalks. Off: SetDontMove applies exactly as vanilla.
; SetRestrained is NEVER refused, on or off: the game applies it and PPB announces it, so VR Chains & Devices can add
; its Havok Bind on top. Every release is announced either way.
; ⚠ VR Chains & Devices depends on this guard and REQUIRES it at load: with that mod installed the guard is ON even
; if this line says 0 (PPB.log: "RESTRAINT: the SetDontMove guard is REQUIRED by ..."). The dial `holdGuard` in
; PPB_tuning.txt (0 = off, 3/4 = on) still wins. Hot, ~1 s.
bSetDontMoveGuard=1

[Diagnostics]
; FRAME LANES (2026-09-30) - a DEV MEASUREMENT for the performance work. It must be 0 (or this whole section
; absent) in any release. 1 = at game start PPB verifies five points in the game's code and hooks them (all or
; nothing), then writes one 'LANES' line per second and one 'LANES SEATS' line per 10 seconds to PPB.log:
; how long the main thread's scene render takes, how long the physics update takes beside it, and whether the
; main thread has to wait for the game's job threads. Log only - it moves nothing and changes no physics.
; 0 or absent = no hook is installed, the game's code is untouched. INSTALL needs a game restart; setting it to 0
; while the game runs only stops the log lines.
bFrameLanes=0

; HAVOK BREAST BENCH (2026-09-28, handover 67; gated 2026-09-30, handover 79) - a DEV instrument: 1 = the console command 'hsbperf' is
; registered (the self-running breast bench; results in My Games/Skyrim VR/SKSE/PPB_bench.log). Must be 0 or absent in a release.
; Read at game start only.
bBreastBench=0

; CONSOLE TEST SEQUENCER (2026-10-04, PCW stage 1b) - a DEV tool. Must be 0 or absent in a release. 1 = the console commands
; 'pcwtest' / 'pcwnext' exist and PPB can walk a scripted test on its own clock (knobs are changed in memory only, never in a file).
; Read at game start only.
bTestSeq=0
; the script 'pcwtest' starts: dry | short | full. Read when the command is typed (no restart needed).
sTestSeqScript=
sRoomPicks=
; start / stop WITHOUT the console: change this number while the game runs (read once a second; the value at launch starts nothing).
iTestSeqGo=0
; the HUD line: 1 = the engine's HUD message, 2 = Papyrus Debug.Notification. Read at every line (no restart needed).
iTestSeqHud=1
; THE CONTACT STEPS OF THE SCRIPT 's7sp' (2026-10-10, PCW stage 7) - PPB asks StandPoint to walk one follower up to another
; and sends an animation event to her while she stands close. Every key is optional: a commented line shows the value that
; is compiled into PPB.dll. Read when 'pcwtest' is typed (no restart). Needs StandPoint 0.9.8 or newer, else no start.
;sContactWalker=Carmella     ; the follower who walks (her name, or its beginning)
sContactTarget=; the follower she walks up to (StandPoint holds her in place for the contact)
;fContactDistCm=30           ; how close the walker stops, in cm
;sContactAnim=IdleApplaud2   ; the animation event sent to the walker. Others: IdleSurrender - IdleLockPick (+ sContactAnimEnd=IdleForceDefaultState)
;fContactAnimEveryS=8        ; sent again every N seconds of the stay (0 = once). Keep it at 1 or more: every send starts a thread
;sContactAnimEnd=            ; an event sent when the stay ends (empty = none)
;iContactPose=0              ; StandPoint's own pose number for the walker (0 = none)
