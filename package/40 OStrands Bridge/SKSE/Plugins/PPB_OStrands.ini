; ═══════════════════════════════════════════════════════════════════════════════
;  PPB_OStrands.ini — the PPB -> OStrands bridge (PPB_OStrands.dll)
;  HOT FILE: edits apply within ~1 second, no restart. ';' or '#' start a comment.
;  Log: My Games/Skyrim VR/SKSE/PPB_OStrands.log
;
;  What it does:
;   1. PPB raises your schlong while a hand is on it (genBend / genBendPlayer in PPB_tuning.txt).
;   2. While it is up, this plugin measures how far your gripping hand travels ALONG the shaft.
;      Only the hand moving relative to the shaft counts - walking or turning with a still hand does not.
;   3. When that travel reaches ClimaxStrokeU, OStrands climaxes you: real OStrands semen from the tip,
;      colliding with and resting on every body within CollisionRangeU.
;   4. The spurts' path is swept and every NPC it lands on gets a semen decal (needs PPB_OStrands.esp).
;   5. A mod event "PPB_OStrands_Climax" is sent (numArg = stroke travel, sender = the player) for other mods.
;
;  OStrands must allow semen outside SexLab: in OStrands_User.ini (or its SKSE Menu Framework page) set
;      [Semen]
;      Enabled = true
;  With "auto" and no OCum installed OStrands refuses the climax (PPB_OStrands.log warns about it at start).
; ═══════════════════════════════════════════════════════════════════════════════

[General]
Enabled = 1
; 1 = a STROKE line per second while stroking, plus one line per pulse and per decal.
; (Without it the log still records every state change: schlong found, erect yes/no, hand gripping / let go,
;  meter 25/50/75%, climax - enough to see where it stops.)
DebugLog = 0
; on-screen note every time the bridge triggers a climax ("PPB OStrands: climax"). If you see it and no semen
; appears, the trigger works and OStrands refused - turn on [General] DebugLog in OStrands_User.ini to see why.
Notifications = 1
; TEST: press this keyboard key (DirectInput scan code) to climax right now, without stroking.
; 199 = Home. 0 = off. Other keys: 207 End, 210 Insert, 211 Delete, 201 Page Up, 209 Page Down.
TestKey = 199
; TEST without a keyboard: change this to 1 and save while the game runs = one climax now. Set it back to 0 after.
TestClimax = 0

[Trigger]
; How close a palm or finger joint must be to the shaft line to count as gripping it, game units (1u ~ 1.43 cm).
; PPB's own touch radius (genBendTouchU) is 8.
GripRadiusU = 7.0
; Hand speed along the shaft, u/s. Slower = tremor / tracking jitter, ignored. Faster = a tracking jump, ignored.
MinStrokeSpeedU = 4.0
MaxStrokeSpeedU = 400.0
; Total stroke travel needed to climax, in units. A typical stroke is ~5u each way, so 150 ~ 15 full strokes.
; Lower = sooner.
ClimaxStrokeU = 150.0
; Once you stop stroking for DecayDelaySec, the meter drains at DecayPerSec units per second.
DecayPerSec = 15.0
DecayDelaySec = 3.0
; 1 = strokes only count while PPB has the schlong raised. "Raised" = pointing away from straight down:
; dot(shaft, down) <= ErectMaxDownDot (hanging ~ 0.9-1.0; level ~ 0.0; 0.5 = lifted 60 degrees from hanging).
RequireErect = 1
ErectMaxDownDot = 0.5
; Seconds before the next climax can happen. Stroking during it only fills the meter half way.
CooldownSec = 30.0
; 1 = ALSO climax when PPB announces PPB_PlayerMasturbation (the hand left the groin at full erection),
; without any stroking. Off by default: the stroke meter is the "enough movement" trigger.
TriggerOnPPBRelease = 0
; How often the meter samples the hands (10 - 90).
TickHz = 30

[OStrands]
; The scene id the bridge's climaxes carry inside OStrands. Anything but 0 (0 is OStim's player scene).
ThreadId = 7340
; Every actor within this range of you is handed to OStrands as a collision body, so its fluid lands on them
; instead of passing through.
CollisionRangeU = 400.0

[Decals]
Enabled = 1
; NPCs further than this from the tip are never marked.
MaxRangeU = 350.0
; Speed of the first spurt out of the tip, u/s; each later pulse is PulseFalloff weaker (0.18 = 18% each).
; Raise LaunchSpeedU if decals land short of where OStrands' fluid lands, lower it if they land beyond.
LaunchSpeedU = 260.0
PulseFalloff = 0.18
; 0 = use OStrands' own [Semen] Pulses / [Physics] Gravity, so the sweep follows the same fluid.
Pulses = 0
PulseIntervalSec = 0.45
Gravity = 0
; Rays per pulse (the first goes straight down the shaft, the rest scatter inside SpreadDeg). Each ray marks the
; first body it reaches - so a spurt can mark two NPCs standing side by side, but never one hidden behind another.
RaysPerPulse = 3
SpreadDeg = 7
MaxDecalsPerPulse = 3
; Scales the body capsules the rays test against (1.0 = skin plus a little).
BodyRadiusScale = 1.0
; 1 = dead NPCs get marked too
IncludeDead = 1

; Decals are the game's own skinned decals (like blood), so the game's limits apply. If NPCs get few or no marks,
; check Skyrim.ini / SkyrimPrefs.ini:  [Decals] bDecals=1, bSkinnedDecals=1, uMaxSkinDecals, uMaxSkinDecalsPerActor.
