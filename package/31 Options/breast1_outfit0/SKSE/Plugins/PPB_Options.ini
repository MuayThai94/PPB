;  PPB_Options.ini — Precision Physic Bodies' SECOND install-choice file (born 2026-09-30, handover 79)
;  The installer (FOMOD) writes this file. Read AFTER PPB.ini: a key here wins. HOT unless noted (~1 s).
;  A missing file or key = the coded default named on each line.
; ═══════════════════════════════════════════════════════════════════════════════

[Features]
; HAVOK BREAST: every woman on a PPB skeleton (human, elf, orc, Yvanni, khajiit, argonian, the mapped followers) gets PPB's own
; Havok breast - three layers of collision bodies fitted on her live skin, so a hand dents, moves and then pushes her. Her breast
; bones follow it on a CBBE / 3BA body (the 3 chain bones) or a GT Softbody body (its 25 bones). CBPC is stopped on her breast bones
; and GT Softbody's breast XML is switched to a kinematic copy while she has one (both given back when she has none).
; 0 / missing = off: your own breast physics (CBPC / SMP) run exactly as before. Switching it off mid-game releases every breast.
bHavokBreast=1

; OUTFIT GUARD (a sub-option of the equip gestures; moot without them): an NPC whose last outfit piece a PPB gesture took off, or
; a generic NPC a PPB gesture dressed, is never re-dressed in her default outfit by the game (or SPID) until she wears something
; new. 0 = the game's own outfit rules apply to them. The hook installs at game start (restart after a change); its answer is hot.
bOutfitGuard=0
