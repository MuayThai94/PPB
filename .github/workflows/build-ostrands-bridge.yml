name: Build PPB_OStrands.dll

on:
  push:
    paths:
      - "OStrandsBridge/**"
      - ".github/workflows/build-ostrands-bridge.yml"
  workflow_dispatch:

permissions:
  contents: write

# A newer push supersedes a running build on the same branch.
concurrency:
  group: build-ostrands-bridge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    env:
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
    steps:
      - uses: actions/checkout@v4

      - name: Export GitHub Actions cache variables for vcpkg
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: MSVC developer prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        working-directory: OStrandsBridge
        run: |
          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          cmake --preset release

      - name: Build
        working-directory: OStrandsBridge
        run: cmake --build --preset release

      - name: Lay out the mod folder
        run: |
          New-Item -ItemType Directory -Force "package/40 OStrands Bridge/SKSE/Plugins" | Out-Null
          Copy-Item OStrandsBridge/build/PPB_OStrands.dll "package/40 OStrands Bridge/SKSE/Plugins/"

      - uses: actions/upload-artifact@v4
        with:
          name: PPB_OStrands-dll
          path: package/40 OStrands Bridge/SKSE/Plugins/PPB_OStrands.dll

      - uses: actions/upload-artifact@v4
        with:
          name: Precision-Physic-Bodies-with-OStrands
          path: package/

      # Keep the built DLL in the branch too, so the package folder is complete without downloading an artifact.
      # Only package/ changes here, which is outside this workflow's path filter, so the push does not re-trigger it.
      - name: Commit the built DLL to the branch
        shell: bash
        run: |
          DLL="package/40 OStrands Bridge/SKSE/Plugins/PPB_OStrands.dll"
          cp "$DLL" "$RUNNER_TEMP/PPB_OStrands.dll"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "${GITHUB_REF_NAME}"
          # A newer push changed the bridge source after this run started: its own run will commit, not this one.
          if ! git diff --quiet "${GITHUB_SHA}" "origin/${GITHUB_REF_NAME}" -- OStrandsBridge; then
            echo "Bridge source changed since ${GITHUB_SHA::7}; leaving the DLL to the newer run"; exit 0
          fi
          # Start from the branch tip (another run may have committed a DLL meanwhile) and put this build on top.
          git reset --hard "origin/${GITHUB_REF_NAME}"
          cp "$RUNNER_TEMP/PPB_OStrands.dll" "$DLL"
          git add -f "$DLL"
          if git diff --cached --quiet; then echo "DLL unchanged"; exit 0; fi
          git commit -m "Build: PPB_OStrands.dll from ${GITHUB_SHA::7}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
