name: Build PPB_OStrands.dll

on:
  push:
    paths:
      - "OStrandsBridge/**"
      - ".github/workflows/build-ostrands-bridge.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    env:
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
    steps:
      - uses: actions/checkout@v4

      - name: Export GitHub Actions cache variables for vcpkg
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: MSVC developer prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        working-directory: OStrandsBridge
        run: |
          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          cmake --preset release

      - name: Build
        working-directory: OStrandsBridge
        run: cmake --build --preset release

      - name: Lay out the mod folder
        run: |
          New-Item -ItemType Directory -Force "package/40 OStrands Bridge/SKSE/Plugins" | Out-Null
          Copy-Item OStrandsBridge/build/PPB_OStrands.dll "package/40 OStrands Bridge/SKSE/Plugins/"

      - uses: actions/upload-artifact@v4
        with:
          name: PPB_OStrands-dll
          path: package/40 OStrands Bridge/SKSE/Plugins/PPB_OStrands.dll

      - uses: actions/upload-artifact@v4
        with:
          name: Precision-Physic-Bodies-with-OStrands
          path: package/
